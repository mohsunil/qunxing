l_english:
 haipam_arsenal_0:0 "海帕姆舰造基址"
 haipam_arsenal_1:0 "海帕姆轨道装配厂"
 haipam_arsenal_2:0 "海帕姆行星船坞群"
 haipam_arsenal_3:0 "海帕姆皇家舰造世界"
 haipam_arsenal_0_DESC:0 "在海帕姆母星轨道建立分阶段舰造工程。母星居民、地表与已有建筑保留。"
 haipam_arsenal_1_DESC:0 "十条舰造线投入运转；提高全帝国造舰速度。"
 haipam_arsenal_2_DESC:0 "扩建为二十五条舰造线，进一步提升补舰能力。"
 haipam_arsenal_3_DESC:0 "六十条舰造线形成环绕母星的工业体系；全帝国造舰速度提高200%。原型数值，待性能和实战验证。"
 haipam.251.name:0 "舰造基址建成"
 haipam.251.desc:0 "海帕姆星的轨道基址已完成固定与补给接口。下一阶段将安装第一批船坞。"
 haipam.252.name:0 "轨道装配厂投产"
 haipam.252.desc:0 "十条生产线已就绪。船体、装甲与轴炮部件可以在同一工业链中装配。"
 haipam.253.name:0 "行星船坞群"
 haipam.253.desc:0 "轨道生产能力扩大到二十五条舰造线，母星供应体系开始支撑大规模舰团补充。"
 haipam.254.name:0 "皇家舰造世界"
 haipam.254.desc:0 "六十条舰造线在海帕姆星轨道运行。母星仍是可居住的帝国中心，轨道设施则承接舰团的批量生产。"
 haipam.arsenal.ok:0 "让下一批舰船进入装配。"
