l_english:
 haipam.201.name:0 "军耀殿落成"
 haipam.201.desc:0 "军耀殿的续生系统开始运转。白蚊人领袖的神经档案与再生组织在此持续维护，帝国的行政、研究与军令获得长期延续。"
 haipam.201.ok:0 "让帝国的意志延续。"
 haipam.211.name:0 "第一批灵蚊人"
 haipam.211.desc:0 "灵能理论突破后，皇家研究记录确认了新的灵蚊人种族。首批灵蚊人已在首都出现，他们仍属于白蚊人谱系。重力子神殿将把这些潜能转化为稳定的社会制度。"
 haipam.211.ok:0 "继续研究重力子神殿。"
 haipam.220.name:0 "选择皇家模板"
 haipam.220.desc:0 "孵化场已完成快速改造准备。选择一种灰蚊人专精模板，替换此前的皇家生产专精；各变体的其他基因保持原样。"
 haipam.220.industry:0 "工业模板：勤勉。"
 haipam.220.food:0 "农业模板：农耕。"
 haipam.220.research:0 "科研模板：聪慧。"
 haipam.220.cancel:0 "暂时保留现有模板。"
 haipam.231.name:0 "神殿的合声"
 haipam.231.desc:0 "重力子神殿捕捉到一次稳定的集体灵能共振。我们可以把这一经验用于社会协作，或进一步研究意识与生物之间的联系。"
 haipam.231.harmony:0 "用于社会协作。"
 haipam.231.insight:0 "转入社会学研究。"
 haipam.232.name:0 "遥远的回声"
 haipam.232.desc:0 "灵蚊人的知觉沿着航线向外延伸。一些信号带来交换与联络的机会，另一些则让卫队提前察觉冲突。"
 haipam.232.trade:0 "关注贸易航线。"
 haipam.232.guard:0 "加强舰队与卫队。"
 tech_haipam_royal_biology:0 "皇家生物工程"
 tech_haipam_royal_biology_desc:0 "开放灰蚊人皇家模板程序；原版生物改造项目成本降低90%，生物特质点数+2。原型数值。"
 tech_haipam_royal_governance:0 "军耀殿制度"
 tech_haipam_royal_governance_desc:0 "开放首都改造决议，将帝国首都升级为军耀殿，维系白蚊人领袖的持续生命。"
 tech_haipam_royal_design:0 "皇家设计局"
 tech_haipam_royal_design_desc:0 "开放皇家设计局，提供物理学与工程学专门岗位和基础研究产出。"
 tech_haipam_fleetization:0 "舰团化"
 tech_haipam_fleetization_desc:0 "小型舰团协同作战：降低单舰队指挥上限，提高帝国海军容量并大幅降低维护。"
 tech_haipam_postal_fleets:0 "邮政舰队"
 tech_haipam_postal_fleets_desc:0 "贸易航线承担运输与船只回收。开放邮政枢纽，提高贸易产出；邮政枢纽运作期间，每年可能找到需要维修的旧式轴炮舰。"
 tech_haipam_axial_small:0 "小型等离子轴炮"
 tech_haipam_axial_small_desc:0 "开放小型轴向等离子武器。"
 tech_haipam_axial_medium:0 "中型等离子轴炮"
 tech_haipam_axial_medium_desc:0 "开放中型轴向等离子武器。"
 tech_haipam_axial_heavy:0 "重型等离子轴炮"
 tech_haipam_axial_heavy_desc:0 "开放重型轴向等离子武器。"
 tech_haipam_graviton_cult:0 "重力子神殿"
 tech_haipam_graviton_cult_desc:0 "开放灵蚊人专属军队、神殿与灵能事件。灵蚊人的初次出现由灵能理论触发。"
 tech_haipam_dual_helix:0 "王家双螺旋"
 tech_haipam_dual_helix_desc:0 "额外生物特质点数+4。海帕姆可并行选择基因与灵能飞升，仍须支付各自的科技、飞升槽和传统成本。"
 tech_haipam_planetary_arsenal:0 "海帕姆行星兵工厂"
 tech_haipam_planetary_arsenal_desc:0 "开放母星分阶段舰造工程，提升舰船生产速度。"
 building_haipam_royal_hall:0 "军耀殿"
 building_haipam_royal_hall_desc:0 "首都政治与指挥中心。产出大量凝聚力；建筑运作期间，帝国及候选池中的白蚊人领袖获得不朽。"
 building_haipam_royal_design_bureau:0 "皇家设计局"
 building_haipam_royal_design_bureau_desc:0 "增加物理学家与工程师岗位，并直接产出物理学与工程学研究。空缺专家岗位由皇家孵化场按需补员。"
 building_haipam_graviton_temple:0 "重力子神殿"
 building_haipam_graviton_temple_desc:0 "灵蚊人的研究与礼仪设施。产出凝聚力、贸易，开放神殿事件及灵蚊人卫队招募。"
 building_haipam_postal_hub:0 "皇家邮政枢纽"
 building_haipam_postal_hub_desc:0 "邮政舰队的补给与货运枢纽，提供商贸岗位和贸易产出。"
 decision_haipam_royal_hall:0 "建设军耀殿"
 decision_haipam_royal_hall_desc:0 "花费一年将当前首都建筑改造为军耀殿。此决议替换现有首都建筑。"
 decision_haipam_gray_gene_program:0 "皇家灰蚊人模板程序"
 decision_haipam_gray_gene_program_desc:0 "30天完成准备，选择工业、农业或科研专精，应用于帝国所有灰蚊人基因变体。三种程序相互替换；保留其他非程序基因。"
 leader_trait_haipam_royal_continuity:0 "军耀殿·王家续生"
 leader_trait_haipam_royal_continuity_desc:0 "军耀殿运作期间获得无限自然寿命，仍可因战斗和剧情事件死亡。"
 trait_haipam_ling:0 "灵蚊人"
 trait_haipam_ling_desc:0 "白蚊人谱系中的灵能种族。凝聚力与贸易专长，保留白蚊人领袖资格。"
 haipam_ling_guard:0 "灵蚊人卫队"
 haipam_ling_guard_desc:0 "重力子神殿训练的专属灵能地面部队。"
 HAIPAM_LING:0 "灵蚊人"
 HAIPAM_LING_desc:0 "灵蚊人"
 haipam_graviton_trade:0 "重力子·贸易回声"
 haipam_graviton_trade_desc:0 "神殿回声提高帝国贸易产出。"
 haipam_graviton_guard:0 "重力子·卫御回声"
 haipam_graviton_guard_desc:0 "神殿回声提高舰体与军队耐久。"
