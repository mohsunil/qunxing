l_english:
 NAME_HAIPAM_FRONTIER:0 "[haipam_secession_colony.GetName]舰团领"
 decision_haipam_frontier_command:0 "边疆舰团事务"
 decision_haipam_frontier_command_desc:0 "查看舰团组织度，暂停或恢复自动拓殖，支付经费整编边疆体系。只在首都使用。"
 haipam_friendly_autonomy:0 "友好舰团自治"
 haipam.org.high:0 "充足（70—100）"
 haipam.org.stable:0 "稳定（40—69）"
 haipam.org.low:0 "偏低（20—39）"
 haipam.org.critical:0 "不足（0—19）"
 haipam.301.name:0 "舰团向边疆延伸"
 haipam.301.desc:0 "舰团化让独立开拓队成为可能。每年最多建立一座边疆哨站并启动一处殖民，必须支付实际经费。哨站只选择相邻、已勘测、无主且没有敌对舰队的星系；殖民还要求适居性达到60%。重力子神殿运作时停止签发新的开拓任务。\n\n首都的“边疆舰团事务”决议可管理拓殖和组织度。"
 haipam.301.advance:0 "开始自动拓殖。"
 haipam.301.pause:0 "先暂停，保留开拓编制。"
 haipam.310.name:0 "边疆舰团事务"
 haipam.310.desc:0 "组织度：§Y[This.GetHaipamFrontierOrganization]§!。\n\n哨站经费：100合金、50影响力、100能量。殖民工程包：200合金、800矿物、300食物、200消费品、200能量，等待一年，包含孵化场和反应釜设备。\n\n组织度每年恢复5，建站消耗4，派出殖民团消耗6；神殿运作时每年额外恢复5。整编恢复25，五年内只能进行一次。组织度持续两年低于20时，成熟的自动殖民地可能友好独立。暂停只停止新任务，已经出发的殖民团继续行程。"
 haipam.310.resume:0 "恢复自动拓殖。"
 haipam.310.pause:0 "暂停新的开拓任务。"
 haipam.310.reorganize:0 "花费500凝聚力和500能量整编。"
 haipam.310.close:0 "结束会议。"
 haipam.322.name:0 "边疆殖民团落地"
 haipam.322.desc:0 "开拓团完成了一年的建设准备，新殖民地已并入帝国。孵化场和反应釜工程包已经安装；白蚊人负责开拓组织，灰蚊人仍按空缺岗位经过孵化周期补员。"
 haipam.322.ok:0 "让殖民地开始生产。"
 haipam.330.name:0 "边疆组织度偏低"
 haipam.330.desc:0 "开拓速度开始超过指挥与补给体系的承受范围。继续推进可能让成熟边疆殖民地自行组成友好的舰团国家。母星、首都与手动建立的殖民地不在此次自动分裂范围内。现在可以整编或暂停新任务。"
 haipam.330.manage:0 "召开边疆会议。"
 haipam.330.continue:0 "保持当前政策。"
 haipam.331.name:0 "友好的分道而行"
 haipam.331.desc:0 "[haipam_secession_colony.GetName]的开拓舰团提出并完成了独立建制。新成立的[haipam_frontier_child.GetName]接管该单殖民地星系，保留白蚊人与灰蚊人的制度，并继承现有科技。双方建立通讯、友好关系与停战，没有爆发叛乱战争。"
 haipam.331.ok:0 "保持航线与联络。"
