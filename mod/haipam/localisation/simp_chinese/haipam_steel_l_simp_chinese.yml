l_simp_chinese:
 NAME_HAIPAM_REFUGE_SYSTEM:0 "边疆避难地"
 NAME_HAIPAM_REFUGE_WORLD:0 "避难星"
 NAME_HAIPAM_STEEL:0 "钢铁蚊人共同体"
 NAME_HAIPAM_INDUSTRIAL_ROBOT:0 "边疆工业机器人"
 NAME_HAIPAM_STEEL_LINE:0 "钢铁轴炮舰"
 NAME_HAIPAM_STEEL_FLEET:0 "钢铁动员舰团"
 haipam_steel_mobilization:0 "钢铁工业动员"
 haipam_grain_repaid:0 "边疆粮援贸易回报"
 haipam_grain_aid:0 "雪中送粮"
 haipam_grain_refused:0 "被拒绝的粮援"
 haipam_steel_solidarity:0 "钢铁舰团互助"
 haipam.401.name:0 "独立舰团的借粮请求"
 haipam.401.desc:0 "[haipam_grain_polity.GetName]由白蚊人与大量工业机器人组成。他们的工业开拓取得进展，有机居民的补给却陷入危机，请求帝国提供3000食物。"
 haipam.401.aid:0 "拨出3000食物。"
 haipam.401.refuse:0 "拒绝粮援。"
 haipam.402.name:0 "饿殍遍地"
 haipam.402.desc:0 "“街道上已经没人争吵了。机器人照常工作，粮仓却没有东西能交给活着的人。”\n\n独立舰团最后的录音没有寒暄。幸存的白蚊人把资源集中到自动化与合成生命研究，求援频道随后归于沉寂。"
 haipam.402.ok:0 "记录这段讯息。"
 haipam.404.name:0 "钢铁蚊人崛起"
 haipam.404.desc:0 "[haipam_grain_polity.GetName]扩建了机器人劳动力，启动合成飞升工程，完成舰队工业动员。四支舰团已经出港，其他自主舰团收到了联合邀请。\n\n他们还需五年整备。停战期、正在进行的战争和附庸关系会延后自动宣战。"
 haipam.404.ok:0 "准备应对舰团。"
 haipam.405.name:0 "粮援之后"
 haipam.405.desc:0 "独立舰团度过了补给危机，回报十年贸易合作（贸易产出+25%）及2000凝聚力。"
 haipam.405.ok:0 "继续合作。"
 haipam.407.name:0 "钢铁舰团的战争"
 haipam.407.desc:0 "[haipam_grain_polity.GetName]正式宣战。已加入钢铁互助的独立海帕姆舰团，在没有战争、附庸或停战约束时加入进攻方。战争目标为羞辱；母星不会被事件直接转移。"
 haipam.407.ok:0 "舰团进入战备。"
