l_simp_chinese:
 HAIPAM_EMPIRE:0 "海帕姆帝国（初航原型）"
 HAIPAM_ADJ:0 "海帕姆"
 HAIPAM_WHITE:0 "白蚊人"
 HAIPAM_GRAY:0 "灰蚊人"
 HAIPAM_HOMEWORLD:0 "海帕姆星"
 HAIPAM_SYSTEM:0 "海帕姆"
 HAIPAM_RULER:0 "海帕姆皇帝"
 haipam_early_empire:0 "海帕姆帝国（初航原型）"
 haipam_early_empire_desc:0 "初入星际的海帕姆帝国。白蚊人执掌帝国，灰蚊人承担非精英岗位。此版本测试人口机制，银心定位、舰团化与飞升尚未接入。肖像取自逐鹿银河本地原图。"
 civic_haipam_royal_biology:0 "皇家协同体系"
 civic_haipam_royal_biology_desc:0 "皇室以协同进化为基础，组织白蚊人与灰蚊人的星际社会。"
 civic_haipam_royal_biology_effects:0 "保留协同进化起源。领袖限定为白蚊人。皇家孵化场按非精英岗位缺口培育灰蚊人；多余灰蚊人自动消失。"
 trait_haipam_white:0 "白蚊人谱系"
 trait_haipam_white_desc:0 "海帕姆皇室与领袖所属谱系。此标记随基因模板保留。"
 trait_haipam_gray:0 "灰蚊人谱系"
 trait_haipam_gray_desc:0 "按岗位需求孵化的非精英人口。停止常规人口增长，不能担任领袖或统治者岗位。有运作中的反应釜时，食物维护费降低50%（原型数值）。"
 building_haipam_royal_hatchery:0 "皇家孵化场"
 building_haipam_royal_hatchery_desc:0 "根据工人与专家岗位缺口安排孵化。原型采用四个月批次，实际空缺出现后约4—5个月补员。岗位减少时取消多余批次。兼具医疗岗位与社会学研究。"
 building_haipam_reactor:0 "反应釜"
 building_haipam_reactor_desc:0 "降低本星球所有灰蚊人及其改造亚种的食物维护费。当前试验值：降低50%。"
 haipam.100.name:0 "海帕姆：初航人口试验"
 haipam.100.desc:0 "皇家孵化场与反应釜已在海帕姆星投入运转。白蚊人承担领袖职责，灰蚊人可从事工人与专家岗位。\n\n本版用于检验4.5.2人口机制；银心开局、轴炮舰、舰团化、飞升和事件链正在后续开发。所有平衡数值均为试验值。"
 haipam.100.ok:0 "开启星际时代。"
 HAIPAM_EMPIRE_desc:0 "初入星际的海帕姆帝国。白蚊人执掌帝国，灰蚊人承担非精英岗位。此版本测试人口机制，银心定位、舰团化与飞升尚未接入。肖像取自逐鹿银河本地原图。"
 EMPIRE_DESIGN_haipam_early_empire_desc:0 "初入星际的海帕姆帝国。白蚊人执掌帝国，灰蚊人承担非精英岗位。此版本测试人口机制，银心定位、舰团化与飞升尚未接入。肖像取自逐鹿银河本地原图。"
 HAIPAM_PORTRAIT_CATEGORY:0 "海帕姆蚊人"
